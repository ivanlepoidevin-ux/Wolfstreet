<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<title>Portefeuille</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#0E6A6A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Portefeuille">
<style>
:root{--bg:#EDF0F3;--card:#fff;--ink:#16222D;--mute:#5C6B78;--line:#D3DAE0;--acc:#0E6A6A;--pos:#1B7A4B;--neg:#B0362E;--sl:40%}
@media (prefers-color-scheme:dark){:root{--bg:#101A22;--card:#18242E;--ink:#E7EDF2;--mute:#93A3B0;--line:#2A3946;--acc:#5FC1B8;--pos:#5DCB8F;--neg:#F08A80;--sl:62%}}
*{box-sizing:border-box}
html,body{margin:0;max-width:100%;overflow-x:hidden;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-top:env(safe-area-inset-top,0px)}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 12px;padding:16px 16px 10px}
h1{font:600 26px/1.1 Georgia,"Iowan Old Style",serif;margin:0}
#meta{display:flex;align-items:center;gap:8px;color:var(--mute);font-size:12px}
#refresh{background:none;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:7px 11px;font:inherit;font-size:13px}
main{padding:0 12px 96px}
h2{font:600 21px/1.2 Georgia,"Iowan Old Style",serif;margin:18px 4px 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:6px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
td{padding:10px 12px;text-align:right;border-top:1px solid var(--line);overflow-wrap:anywhere;vertical-align:top}
td:first-child{text-align:left}
tr:first-child td{border-top:0}
tr.head td{font-weight:600;color:var(--mute);background:var(--bg);font-size:13px}
td i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:8px}
.pos{color:var(--pos)}.neg{color:var(--neg)}
.pvc{padding:6px 14px;margin-bottom:12px}
.pv{padding:11px 0}.pv+.pv{border-top:1px solid var(--line)}
.pr{display:flex;justify-content:space-between;gap:10px;margin-bottom:7px}
.pr b{font-variant-numeric:tabular-nums}
.trk{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.trk i{display:block;height:100%;border-radius:4px}
.trk i.pos{background:var(--pos)}.trk i.neg{background:var(--neg)}
.pv.one{text-align:center;padding:20px 0}
.pl{color:var(--mute);font-size:13px}
.big{font:600 38px/1.2 Georgia,"Iowan Old Style",serif;font-variant-numeric:tabular-nums}
.donut{display:block;width:min(58vw,220px);height:auto;margin:14px auto 8px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;padding:15px 2px;background:none;border:0;color:var(--mute);font:600 14px system-ui,sans-serif}
nav button[aria-selected=true]{color:var(--acc);box-shadow:inset 0 2px 0 var(--acc)}
nav button:focus-visible,#refresh:focus-visible{outline:2px solid var(--acc);outline-offset:-2px}
.msg{padding:28px 10px;color:var(--mute);text-align:center}
</style>
</head>
<body>
<header>
  <h1>Portefeuille</h1>
  <div id="meta"><span id="status">Chargement…</span><button id="refresh" type="button">Actualiser</button></div>
</header>
<main id="view"></main>
<nav role="tablist" id="nav"></nav>
<script>
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vT1ZqyzzApyrgCRhIr04OF6Ix9LHhNTYeFycQ7BomjblePKS9cTzs2MEYDcLDNo6A/pub?gid=1991388935&single=true&output=csv";
// ▼ Les onglets de l'appli : nom + plage de cellules du Sheet
const TABS = [
  {label:"Récap",        range:"A1:B8", chart:"plusvalue"},
  {label:"Détail",       range:"A10:B30"},
  {label:"Répartitions", range:"A48:C82"}
];

const norm = s => s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().trim();
const cap = s => s.charAt(0).toUpperCase() + s.slice(1).toLowerCase();
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const num = s => { const n=parseFloat(s.replace(/[^\d,.\-−]/g,"").replace("−","-").replace(",",".")); return isNaN(n)?NaN:n };
const sign = s => /^[-−]\s*\d/.test(s) ? "neg" : /^\+\s*\d/.test(s) ? "pos" : "";
const color = i => `hsl(${(172+i*47)%360} 55% var(--sl))`;
const PREFIX = /^\s*(pays|secteurs?|positions?)\s*(?:[:：]\s*(.*))?$/i;

function parseCSV(t){
  const rows=[]; let r=[], c="", q=false;
  for(let i=0;i<t.length;i++){
    const ch=t[i];
    if(q){ if(ch=='"'){ if(t[i+1]=='"'){c+='"';i++} else q=false } else c+=ch }
    else if(ch=='"') q=true;
    else if(ch==","){ r.push(c); c="" }
    else if(ch=="\n"){ r.push(c); rows.push(r); r=[]; c="" }
    else if(ch!="\r") c+=ch;
  }
  if(c!==""||r.length){ r.push(c); rows.push(r) }
  return rows;
}
const colIdx = L => [...L.toUpperCase()].reduce((a,ch)=>a*26+ch.charCodeAt(0)-64,0)-1;
function sliceRange(rows, range){
  const m=range.match(/^([A-Z]+)(\d+):([A-Z]+)(\d+)$/i);
  const c0=colIdx(m[1]), c1=colIdx(m[3]), r0=+m[2]-1, r1=+m[4]-1, out=[];
  for(let r=r0;r<=r1;r++){
    const row=rows[r]||[];
    out.push(Array.from({length:c1-c0+1},(_,k)=>(row[c0+k]||"").trim()));
  }
  return out;
}
/* Regroupe les lignes : « Pays : France » → titre « Pays » + ligne « France » */
function buildSections(rows){
  const secs=[], byTitle={}; let cur=null;
  for(const r of rows){
    if(r.every(x=>!x)){ cur=null; continue; }
    const cells=r.slice(); let title=null, titleOnly=false;
    for(let c=0;c<cells.length;c++){
      const m=cells[c].match(PREFIX);
      if(m){ if(!title){ title=m[1]; titleOnly=!(m[2]||"").trim(); } cells[c]=(m[2]||"").trim(); }
    }
    if(title){
      const key=norm(title);
      let sec=byTitle[key];
      if(!sec){ sec={title:cap(title),head:null,rows:[]}; byTitle[key]=sec; secs.push(sec); }
      cur=sec;
      if(titleOnly){ if(cells.some(Boolean)) sec.head=cells; } else sec.rows.push(cells);
    } else {
      if(!cur){ cur={title:null,head:null,rows:[]}; secs.push(cur); }
      cur.rows.push(cells);
    }
  }
  return secs.filter(s=>s.rows.length||s.head);
}
function valueCol(sec){
  const n=sec.rows[0]?sec.rows[0].length:0;
  for(let c=1;c<n;c++){
    const filled=sec.rows.filter(r=>r[c]);
    if(filled.length>=2 && filled.filter(r=>!isNaN(num(r[c]))).length>=filled.length*0.6) return c;
  }
  return -1;
}
function donut(vals){
  const tot=vals.reduce((a,v)=>a+Math.abs(v),0), R=44, C=2*Math.PI*R;
  let off=0;
  const arcs=vals.map((v,i)=>{
    const len=Math.abs(v)/tot*C;
    const s=`<circle cx="60" cy="60" r="${R}" fill="none" stroke="${color(i)}" stroke-width="22" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 60 60)"/>`;
    off+=len; return s;
  }).join("");
  return `<svg class="donut" viewBox="0 0 120 120" role="img" aria-label="Graphique de répartition">${arcs}</svg>`;
}
function renderSection(sec, withDonut=true){
  const all=[...(sec.head?[sec.head]:[]),...sec.rows];
  const cols=[...Array(all[0].length).keys()].filter(c=>all.some(r=>r[c]));
  const vc=valueCol(sec);
  const chart = vc>=0 && sec.rows.every(r=>!r[vc]||!isNaN(num(r[vc])));
  const vals = chart ? sec.rows.map(r=>isNaN(num(r[vc]))?0:num(r[vc])) : [];
  const useChart = withDonut && chart && vals.reduce((a,v)=>a+Math.abs(v),0)>0;
  const tr=(r,cls,i)=>`<tr class="${cls}">${cols.map((c,k)=>`<td class="${cls?"":sign(r[c])}">${k===0&&useChart&&i>=0?`<i style="background:${color(i)}"></i>`:""}${esc(r[c])}</td>`).join("")}</tr>`;
  const body=(sec.head?tr(sec.head,"head",-1):"")+sec.rows.map((r,i)=>tr(r,"",i)).join("");
  return (sec.title?`<h2>${esc(sec.title)}</h2>`:"")+`<div class="card">${useChart?donut(vals):""}<table>${body}</table></div>`;
}
const PV = /plus|gain|\+\/-/;
function pvChart(raw, range){
  const items=raw.filter(r=>PV.test(norm(r[0]))).map(r=>({label:r[0],raw:r[1]||"",v:num(r[1]||"")})).filter(i=>!isNaN(i.v));
  if(!items.length) return `<div class="msg">Aucune ligne « plus-value » trouvée dans ${range}.</div>`;
  const cls=v=>v<0?"neg":"pos";
  let h;
  if(items.length===1){
    const i=items[0];
    h=`<div class="pv one"><div class="pl">${esc(i.label)}</div><div class="big ${cls(i.v)}">${esc(i.raw)}</div></div>`;
  } else {
    const max=Math.max(...items.map(i=>Math.abs(i.v)))||1;
    h=items.map(i=>`<div class="pv"><div class="pr"><span>${esc(i.label)}</span><b class="${cls(i.v)}">${esc(i.raw)}</b></div><div class="trk"><i class="${cls(i.v)}" style="width:${Math.max(3,Math.abs(i.v)/max*100)}%"></i></div></div>`).join("");
  }
  return `<div class="card pvc">${h}</div>`;
}
/*UI*/
let rows=[], cur=0;
const $ = s => document.querySelector(s);
function render(){
  $("#nav").innerHTML=TABS.map((t,i)=>`<button role="tab" aria-selected="${i===cur}" data-i="${i}">${esc(t.label)}</button>`).join("");
  document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{cur=+b.dataset.i;render()});
  const t=TABS[cur], raw=sliceRange(rows,t.range), secs=buildSections(raw), pv=t.chart==="plusvalue";
  $("#view").innerHTML = secs.length ? (pv?pvChart(raw,t.range):"")+secs.map(s=>renderSection(s,!pv)).join("") : `<div class="msg">Aucune donnée dans ${t.range}.</div>`;
  window.scrollTo(0,0);
}
async function load(){
  const st=$("#status");
  st.textContent="Actualisation…";
  try{
    const res=await fetch(CSV_URL+"&t="+Date.now(),{cache:"no-store"});
    if(!res.ok) throw new Error(res.status);
    const txt=await res.text();
    localStorage.setItem("pf-csv",txt); localStorage.setItem("pf-time",Date.now());
    rows=parseCSV(txt);
    st.textContent="Mis à jour à "+new Date().toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"});
  }catch(e){
    const txt=localStorage.getItem("pf-csv");
    if(txt){
      rows=parseCSV(txt);
      const t=new Date(+localStorage.getItem("pf-time"));
      st.textContent="Hors ligne · "+t.toLocaleString("fr-FR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});
    } else { rows=[]; st.textContent="Impossible de charger le Sheet"; }
  }
  render();
}
$("#refresh").onclick=load;
document.addEventListener("visibilitychange",()=>{ if(!document.hidden) load() });
load();
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
